<h1>{{title}}</h1>

<p>Usuários cadastrados no sistema</p>
<hr />

<a href="{{URL}}/admin/users">
  <button class="btn btn-primary">Voltar</button>
</a>
<hr />

{{status}}

<form method="post">
  <div class="form-group">
    <label for="nome">Nome</label>
    <input
      type="text"
      name="nome"
      id=""
      class="form-control"
      required
      value="{{nome}}"
    />
  </div>
  <div class="row g-3  my-3">
    <div class="form-group my-3 col">
      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        name="email"
        class="form-control"
        required
        value="{{email}}"
      />
    </div>
    <div class="form-group my-3 col">
      <label for="senha">Senha</label>
      <input
        id="senha"
        type="password"
        name="senha"
        class="form-control"
        required
      />
    </div>
  </div>
  <div class="form-group">
    <button type="submit" class="btn btn-success">Salvar</button>
  </div>
</form>
