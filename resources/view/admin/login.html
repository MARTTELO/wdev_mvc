<div class="d-flex justify-content-center col-lg mt-5">
  <div class="card mt-3 text-dark text-center" style="width: 30%">
    <div class="card-header">
      <h1>Login</h1>
    </div>

    <div class="card-body">
      <div>
        {{status}}
      </div>
      <form method="post">
        <div class="form-group">
                   <svg
          xmlns="http://www.w3.org/2000/svg"
          width="48"
          height="48"
          viewBox="0 0 24 24"
          overflow="visible"
          class="mb-3"
        >
          <defs>
            <mask
              id="users-outline-c1"
              maskUnits="userSpaceOnUse"
              x="-2"
              y="-2"
              width="28"
              height="28"
            >
              <rect x="-2" y="-2" width="28" height="28" fill="#fff" />
              <polygon
                points="1.19,18.31 1.19,22.25 3.81,22.69 3.81,20.94"
                fill="#000"
              />
              <polygon
                points="14.19,18.31 14.19,22.25 16.81,22.69 16.81,20.94"
                fill="#000"
              />
            </mask>
          </defs>
          <defs>
            <mask
              id="users-outline-c3"
              maskUnits="userSpaceOnUse"
              x="-2"
              y="-2"
              width="28"
              height="28"
            >
              <rect x="-2" y="-2" width="28" height="28" fill="#fff" />
              <polygon
                points="19.69,14.19 15.75,14.19 15.31,16.81 17.06,16.81"
                fill="#000"
              />
              <polygon
                points="20.19,18.31 20.19,22.25 22.81,22.69 22.81,20.94"
                fill="#000"
              />
            </mask>
          </defs>
          <g
            fill="none"
            stroke="currentColor"
            stroke-width="1.75"
            stroke-linecap="butt"
            stroke-linejoin="miter"
          >
            <path
              d="M12.5 8C12.5 9.933 10.933 11.5 9 11.5C7.067 11.5 5.5 9.933 5.5 8C5.5 6.067 7.067 4.5 9 4.5C10.933 4.5 12.5 6.067 12.5 8Z"
            />
            <path
              d="M2.5 20.5L2.5 19.555L2.861 18.579L5.051 16.024L6.19 15.5L11.81 15.5L12.949 16.024L15.139 18.579L15.5 19.555L15.5 20.5"
              mask="url(#users-outline-c1)"
            />
            <path
              d="M20.5 7.5C20.5 9.157 19.157 10.5 17.5 10.5C15.843 10.5 14.5 9.157 14.5 7.5C14.5 5.843 15.843 4.5 17.5 4.5C19.157 4.5 20.5 5.843 20.5 7.5Z"
            />
            <path
              d="M17.5 15.5L18.923 15.5L19.86 15.95L21.237 17.671L21.5 18.421L21.5 20.5"
              mask="url(#users-outline-c3)"
            />
          </g>
        </svg>

        <div class="form-floating">
          <input
            type="email"
            class="form-control"
            id="floatingInput"
            placeholder="email@teste.com"
            name="email"
          />
          <label for="floatingInput">Usuário:</label>
          <div
            data-lastpass-icon-root=""
            data-lastpass-icon-for="floatingInput"
            style="
              position: relative !important;
              height: 0px !important;
              width: 0px !important;
              display: initial !important;
              float: left !important;
            "
          ></div>
        </div>
        <br>
        <div class="form-floating">
          <input
            type="password"
            class="form-control"
            id="floatingPassword"
            placeholder="Password"
            name="senha"
          />
          <label for="floatingPassword">Senha</label>
          <div
            data-lastpass-icon-root=""
            data-lastpass-icon-for="floatingPassword"
            style="
              position: relative !important;
              height: 0px !important;
              width: 0px !important;
              display: initial !important;
              float: left !important;
            "
          ></div>
        </div>

        <div class="checkbox mb-3 mt-2">
          <label>
            <input type="checkbox" value="remember-me" /> Esqueci a senha
        </label>
        </div>
        <button class="w-100 btn btn-lg btn-danger" type="submit">
          Entrar
        </button>
        <p class="mt-2 mb-3 text-muted">© 2026</p>
      </form>
        </div>
    </div>
  </div>
</div>
